name: Deploy AI servers (release → ECR → EC2)

on:
  push:
    branches: ["release"]
  pull_request:
    branches: ["release"]
  workflow_dispatch:

concurrency:
  group: deploy-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Prediction tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prediction
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: prediction/requirements.txt

      - run: pip install -r requirements.txt
      - run: python -m pytest

  image:
    name: Build & push (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: django
            context: aiServer
            repository: ant-helper-ai-django
          - service: prediction
            context: prediction
            repository: ant-helper-ai-prediction
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        if: github.event_name != 'pull_request'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository
        if: github.event_name != 'pull_request'
        env:
          ECR_REPOSITORY: ${{ matrix.repository }}
        run: |
          if ! aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1; then
            aws ecr create-repository --repository-name "$ECR_REPOSITORY" \
              --image-scanning-configuration scanOnPush=true >/dev/null
            aws ecr put-lifecycle-policy --repository-name "$ECR_REPOSITORY" --lifecycle-policy-text '{
              "rules":[{"rulePriority":1,"description":"keep last 10 images",
                "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},
                "action":{"type":"expire"}}]}' >/dev/null || echo "::warning::could not set ECR lifecycle policy"
          fi

      - name: Build (and push on release)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ github.event_name == 'pull_request' && format('{0}:ci', matrix.repository) || format('{0}/{1}:{2}', steps.ecr.outputs.registry, matrix.repository, github.sha) }}
            ${{ github.event_name == 'pull_request' && format('{0}:ci-latest', matrix.repository) || format('{0}/{1}:latest', steps.ecr.outputs.registry, matrix.repository) }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy ${{ matrix.service }} to EC2
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - service: prediction
            repository: ant-helper-ai-prediction
          - service: django
            repository: ant-helper-ai-django
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_KEY: ${{ secrets.EC2_KEY }}
      DJANGO_SECRETS_JSON: ${{ secrets.SECRETS }}
      DJANGO_MY_SETTINGS_PY: ${{ secrets.DB_SETTINGS }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          required="EC2_HOST EC2_USER EC2_KEY"
          if [ "${{ matrix.service }}" = "django" ]; then required="$required DJANGO_SECRETS_JSON DJANGO_MY_SETTINGS_PY"; fi
          missing=0
          for name in $required; do
            if [ -z "${!name}" ]; then echo "::error::required GitHub secret for '$name' is not set (django: SECRETS / DB_SETTINGS)"; missing=1; fi
          done
          exit $missing

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Resolve ECR registry
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Prepare SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      # secrets.json / my_settings.py 는 이미지에 넣지 않고 EC2 로 올려 컨테이너에 마운트한다.
      - name: Upload Django runtime config (from secrets)
        if: matrix.service == 'django'
        run: |
          mkdir -p cfg
          printf '%s\n' "$DJANGO_SECRETS_JSON" > cfg/secrets.json
          printf '%s\n' "$DJANGO_MY_SETTINGS_PY" > cfg/my_settings.py
          chmod 600 cfg/*
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" 'mkdir -p ~/ant-helper/incoming/django-config'
          scp -i ~/.ssh/ec2_key cfg/secrets.json cfg/my_settings.py "$EC2_USER@$EC2_HOST:ant-helper/incoming/django-config/"

      - name: Docker login on EC2 (ECR)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          aws ecr get-login-password | ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" \
            "command -v docker >/dev/null || { sudo apt-get update -y && sudo apt-get install -y docker.io curl && sudo systemctl enable --now docker; }; \
             sudo docker login --username AWS --password-stdin $REGISTRY"

      - name: Switch container & health check
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ matrix.repository }}:${{ github.sha }}
        run: ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" "SERVICE=$SERVICE IMAGE=$IMAGE bash -s" < .github/scripts/remote-deploy.sh

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/ec2_key
